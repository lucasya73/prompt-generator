<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词生成器 · GPT / Claude / Gemini</title>
<style>
  :root {
    --bg:#f6f7fb; --card:#fff; --line:#d9dee8; --text:#1f2937;
    --muted:#6b7280; --accent:#2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto,
    "PingFang SC", "Microsoft YaHei", sans-serif;
    background:var(--bg); color:var(--text);
  }
  .wrap { max-width:1100px; margin:0 auto; padding:24px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .layout { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .card {
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:16px;
    box-shadow:0 6px 18px rgba(15,23,42,.04);
  }
  label {
    display:block; font-size:13px; font-weight:600;
    margin:10px 0 6px;
  }
  input, select, textarea {
    width:100%; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font:inherit; background:#fff; color:var(--text);
  }
  textarea { min-height:74px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .actions { display:flex; gap:10px; margin-top:14px; }
  button {
    border:0; border-radius:10px; padding:10px 14px;
    font-weight:700; cursor:pointer; background:var(--accent); color:#fff;
  }
  button.secondary { background:#e5e7eb; color:#111827; }
  #result {
    min-height:420px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:13px; line-height:1.55; white-space:pre-wrap;
  }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>提示词生成器</h1>
  <div class="sub">填写任务信息，选择 GPT / Claude / Gemini / 通用，生成对应模型更易理解的提示词。</div>

  <div class="layout">
    <div class="card">
      <div class="row">
        <div>
          <label for="model">目标模型</label>
          <select id="model">
            <option value="gpt">GPT / OpenAI</option>
            <option value="claude">Claude / Anthropic</option>
            <option value="gemini">Gemini / Google</option>
            <option value="universal">通用格式</option>
          </select>
        </div>
        <div>
          <label for="step">推理要求</label>
          <select id="step">
            <option value="internal">内部推理，不输出过程</option>
            <option value="no">直接输出结果</option>
            <option value="yes">输出关键步骤</option>
          </select>
        </div>
      </div>

      <label for="role">角色</label>
      <input id="role" placeholder="例如：资深产品经理、Python 架构师、儿童科普作者">

      <label for="task">任务</label>
      <textarea id="task" placeholder="例如：把下面的技术文档改写成小白能看懂的教程"></textarea>

      <label for="context">背景 / 上下文</label>
      <textarea id="context" placeholder="例如：读者没有编程基础，需要大量类比"></textarea>

      <label for="input">输入数据 / 待处理内容</label>
      <textarea id="input" placeholder="粘贴文档、代码、数据或用户原始需求"></textarea>

      <label for="constraints">约束条件（每行一条）</label>
      <textarea id="constraints" placeholder="不要改变原意&#10;每段不超过 3 句&#10;不要编造数据"></textarea>

      <label for="outputFormat">输出格式</label>
      <textarea id="outputFormat" placeholder="例如：Markdown，包含标题、步骤、注意事项；或 JSON schema"></textarea>

      <label for="examples">示例（可选）</label>
      <textarea id="examples" placeholder="输入示例 → 输出示例"></textarea>

      <label for="tone">语气 / 风格</label>
      <input id="tone" placeholder="例如：友好、简洁、专业、教学式">

      <div class="actions">
        <button onclick="generate()">生成提示词</button>
        <button class="secondary" onclick="copyPrompt()">复制结果</button>
      </div>
      <div class="hint">提示：Claude 模板会自动使用 XML 标签；GPT/Gemini 使用 Markdown 结构化。</div>
    </div>

    <div class="card">
      <label for="result">生成的提示词</label>
      <textarea id="result" readonly placeholder="点击“生成提示词”后显示结果"></textarea>
    </div>
  </div>
</div>

<script>
function val(id) {
  return document.getElementById(id).value.trim();
}

function lines(text) {
  return text ? text.split(/\r?\n/).map(s => s.trim()).filter(Boolean) : [];
}

function bullet(text, prefix = '- ') {
  const arr = lines(text);
  return arr.length ? arr.map(s => prefix + s).join('\n') : '';
}

function fallback(text, fb) {
  return text || fb;
}

function generate() {
  const model = val('model');
  const role = fallback(val('role'), '专业助手');
  const task = fallback(val('task'), '请完成用户指定的任务。');
  const context = val('context');
  const input = val('input');
  const constraints = val('constraints');
  const outputFormat = fallback(val('outputFormat'), '使用清晰、结构化的 Markdown 输出。');
  const examples = val('examples');
  const tone = val('tone');
  const step = val('step');

  const constraintBlock = bullet(constraints) || '- 遵循用户要求，不要编造。';
  const toneLine = tone ? `\n- 语气风格：${tone}` : '';

  const stepText =
    step === 'internal'
      ? '请在内部逐步推理，但最终只输出结果，不要展示推理过程。'
      : step === 'yes'
        ? '请展示关键推理步骤，并给出最终结果。'
        : '请直接给出最终结果。';

  let prompt = '';

  if (model === 'gpt') {
    prompt = `# 角色
你是一位${role}。

# 任务
${task}

${context ? `# 背景\n${context}\n\n` : ''}${input ? `# 输入\n${input}\n\n` : ''}# 约束
${constraintBlock}${toneLine}

# 输出格式
${outputFormat}

${examples ? `# 示例\n${examples}\n\n` : ''}# 执行要求
${stepText}
最终输出必须严格满足上述格式与约束。`;
  } else if (model === 'claude') {
    prompt = `<role>
你是一位${role}。
</role>

${context ? `<context>\n${context}\n</context>\n\n` : ''}${input ? `<input>\n${input}\n</input>\n\n` : ''}<task>
${task}
</task>

<constraints>
${constraintBlock}${toneLine}
</constraints>

<output_format>
${outputFormat}
</output_format>

${examples ? `<examples>\n${examples}\n</examples>\n\n` : ''}<thinking_instruction>
${stepText}
</thinking_instruction>

请严格按照上述 XML 标签中的要求执行。`;
  } else if (model === 'gemini') {
    prompt = `## 角色
你是一位${role}。

## 目标
${task}

${context ? `## 背景\n${context}\n\n` : ''}${input ? `## 输入\n${input}\n\n` : ''}## 约束
${constraintBlock}${toneLine}

## 输出格式
${outputFormat}

${examples ? `## 示例\n${examples}\n\n` : ''}## 执行步骤
1. 理解目标、背景和输入。
2. 按约束条件处理内容。
3. 生成符合输出格式的最终答案。
${stepText}

请现在开始。`;
  } else {
    prompt = `# 角色
你是一位${role}。

# 任务
${task}

${context ? `# 背景\n${context}\n\n` : ''}${input ? `# 输入\n${input}\n\n` : ''}# 约束
${constraintBlock}${toneLine}

# 输出格式
${outputFormat}

${examples ? `# 示例\n${examples}\n\n` : ''}# 执行要求
${stepText}
请严格按以上结构执行。`;
  }

  document.getElementById('result').value = prompt;
}

function copyPrompt() {
  const result = document.getElementById('result');
  if (!result.value.trim()) {
    alert('请先生成提示词');
    return;
  }

  result.select();
  result.setSelectionRange(0, result.value.length);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(result.value)
      .then(() => alert('已复制到剪贴板'))
      .catch(() => {
        document.execCommand('copy');
        alert('已复制到剪贴板');
      });
  } else {
    document.execCommand('copy');
    alert('已复制到剪贴板');
  }
}
</script>
</body>
</html>
